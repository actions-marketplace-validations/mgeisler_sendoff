[package]
name = "sendoff"
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
authors = ["Martin Geisler <martin@geisler.net>"]
description = "GitHub-native release tool"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mgeisler/sendoff"
readme = "README.md"
keywords = ["release", "changelog", "github-actions", "semver", "ci"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0.104"
argh = "0.1.19"
semver = "1.0.28"
thiserror = "2.0.21"
